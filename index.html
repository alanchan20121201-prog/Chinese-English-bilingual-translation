<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilingual Translator | 中英翻譯器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        .textarea-custom {
            resize: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .textarea-custom:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.8s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <nav class="bg-white shadow-sm py-2.5 px-4 sm:px-8 flex justify-between items-center sticky top-0 z-20 border-b border-gray-100">
        <div class="flex items-center gap-2">
            <i class="fas fa-language text-blue-600 text-2xl"></i>
            <h1 class="text-base sm:text-lg font-bold text-gray-900" id="app-title">Translator</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="toggle-ui-lang" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs sm:text-sm font-medium py-1.5 px-3 rounded-full border border-gray-200 transition flex items-center gap-1.5">
                <i class="fas fa-globe text-gray-500"></i>
                <span id="ui-lang-text">中文介面</span>
            </button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-3 sm:px-4 py-3 sm:py-6 max-w-4xl flex flex-col justify-center">
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6">
            
            <!-- Language Switcher Control -->
            <div class="flex items-center justify-between bg-gray-50 p-2 sm:p-2.5 rounded-xl mb-4 border border-gray-100">
                <div class="flex-1 text-center font-semibold text-sm sm:text-base text-blue-600" id="source-lang-label">
                    Chinese (中文)
                </div>
                
                <button id="swap-langs" class="bg-white shadow-sm border border-gray-200 text-gray-600 hover:text-blue-600 p-2 rounded-full hover:bg-blue-50 transition active:scale-95" title="Swap languages">
                    <i class="fas fa-exchange-alt"></i>
                </button>

                <div class="flex-1 text-center font-semibold text-sm sm:text-base text-gray-600" id="target-lang-label">
                    English (英文)
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Input Box (Source) -->
                <div class="relative flex flex-col">
                    <div class="flex justify-between items-center mb-1 px-1">
                        <span id="source-box-title" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Input</span>
                        <span id="char-count" class="text-xs text-gray-400">0 chars</span>
                    </div>
                    <textarea id="source-text" rows="6" class="textarea-custom w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-base placeholder-gray-400 focus:bg-white" placeholder="Type or paste text here..."></textarea>
                    
                    <div class="absolute bottom-3 right-3 flex items-center space-x-1 bg-white/90 backdrop-blur-sm rounded-lg p-1 border border-gray-100 shadow-sm">
                        <button id="speak-source-btn" class="text-gray-400 hover:text-blue-600 p-1.5 rounded-md hover:bg-gray-100 transition" title="Listen pronunciation">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <button id="clear-btn" class="text-gray-400 hover:text-red-500 p-1.5 rounded-md hover:bg-gray-100 transition" title="Clear text">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>

                <!-- Output Box (Target) -->
                <div class="relative flex flex-col">
                    <div class="flex justify-between items-center mb-1 px-1">
                        <span id="target-box-title" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Translation</span>
                    </div>
                    
                    <div id="loading-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex justify-center items-center rounded-xl z-10">
                         <div class="loader rounded-full border-3 border-t-3 border-gray-200 h-8 w-8"></div>
                    </div>

                    <textarea id="target-text" rows="6" class="textarea-custom w-full p-3 bg-blue-50/40 border border-blue-100 rounded-xl text-base text-gray-800" readonly placeholder="Translation will appear here..."></textarea>
                    
                    <div class="absolute bottom-3 right-3 flex items-center space-x-1 bg-white/90 backdrop-blur-sm rounded-lg p-1 border border-gray-100 shadow-sm">
                        <button id="speak-target-btn" class="text-gray-400 hover:text-blue-600 p-1.5 rounded-md hover:bg-gray-100 transition" title="Listen pronunciation">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <button id="copy-btn" class="text-gray-500 hover:text-blue-600 p-1.5 rounded-md hover:bg-gray-100 transition" title="Copy to clipboard">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                 <button id="translate-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-xl shadow-sm hover:shadow transition active:scale-95 w-full sm:w-auto flex items-center justify-center gap-2">
                    <i class="fas fa-language"></i>
                    <span id="translate-btn-text">Translate</span>
                </button>
                <span class="text-xs text-gray-400 text-center sm:text-right" id="auto-translate-hint">Auto-translates as you type</span>
            </div>
            
            <div id="toast" class="hidden mt-3 p-2 bg-green-100 text-green-700 rounded-lg text-center text-sm font-medium transition-opacity duration-300">
                Copied to clipboard!
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sourceText = document.getElementById('source-text');
            const targetText = document.getElementById('target-text');
            const translateBtn = document.getElementById('translate-btn');
            const swapBtn = document.getElementById('swap-langs');
            const clearBtn = document.getElementById('clear-btn');
            const copyBtn = document.getElementById('copy-btn');
            const sourceLangLabel = document.getElementById('source-lang-label');
            const targetLangLabel = document.getElementById('target-lang-label');
            const toggleUiLangBtn = document.getElementById('toggle-ui-lang');
            const loadingOverlay = document.getElementById('loading-overlay');
            const toast = document.getElementById('toast');
            const charCount = document.getElementById('char-count');
            const speakSourceBtn = document.getElementById('speak-source-btn');
            const speakTargetBtn = document.getElementById('speak-target-btn');

            let isEnglishToChinese = false; // Default: Chinese to English
            let currentUiLang = 'en'; // 'en' or 'zh'
            let autoTranslateTimer = null;

            // UI Text Translations
            const uiTranslations = {
                en: {
                    title: 'Bilingual Translator',
                    uiBtn: '中文介面',
                    inputTitle: 'Input',
                    outputTitle: 'Translation',
                    translateBtn: 'Translate',
                    autoHint: 'Auto-translates as you type',
                    toastCopy: 'Copied to clipboard!',
                    sourceZh: 'Chinese (中文)',
                    targetEn: 'English (英文)',
                    sourceEn: 'English (英文)',
                    targetZh: 'Chinese (中文)',
                    placeholderInput: 'Type or paste text here...',
                    placeholderOutput: 'Translation will appear here...',
                    errorMsg: 'Error: Could not translate with available engines.'
                },
                zh: {
                    title: '雙語翻譯器',
                    uiBtn: 'English UI',
                    inputTitle: '輸入文字',
                    outputTitle: '翻譯結果',
                    translateBtn: '翻譯',
                    autoHint: '輸入時自動翻譯',
                    toastCopy: '已複製到剪貼簿！',
                    sourceZh: '中文 (Chinese)',
                    targetEn: '英文 (English)',
                    sourceEn: '英文 (English)',
                    targetZh: '中文 (Chinese)',
                    placeholderInput: '請在此輸入或貼上文字...',
                    placeholderOutput: '翻譯結果將顯示於此...',
                    errorMsg: '錯誤：無法連線至翻譯引擎。'
                }
            };

            function updateLanguageLabels() {
                const t = uiTranslations[currentUiLang];
                if (isEnglishToChinese) {
                    sourceLangLabel.textContent = t.sourceEn;
                    targetLangLabel.textContent = t.targetZh;
                } else {
                    sourceLangLabel.textContent = t.sourceZh;
                    targetLangLabel.textContent = t.targetEn;
                }
            }

            function updateUiLanguage() {
                const t = uiTranslations[currentUiLang];
                document.getElementById('app-title').textContent = t.title;
                document.getElementById('ui-lang-text').textContent = t.uiBtn;
                document.getElementById('source-box-title').textContent = t.inputTitle;
                document.getElementById('target-box-title').textContent = t.outputTitle;
                document.getElementById('translate-btn-text').textContent = t.translateBtn;
                document.getElementById('auto-translate-hint').textContent = t.autoHint;
                sourceText.placeholder = t.placeholderInput;
                targetText.placeholder = t.placeholderOutput;
                updateLanguageLabels();
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2000);
            }

            // 1. MyMemory API
            async function fetchMyMemory(text, isEnToZh) {
                const langPair = isEnToZh ? 'en|zh-TW' : 'zh-TW|en';
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    let result = data.responseData.translatedText;
                    if (!isEnToZh && text.trim() === '中文' && result.toLowerCase() === 'mandarin') {
                        result = 'Chinese';
                    }
                    return result;
                }
                throw new Error('MyMemory translation failed');
            }

            // 2. Lingva Translate API
            async function fetchLingva(text, isEnToZh) {
                const source = isEnToZh ? 'en' : 'zh';
                const target = isEnToZh ? 'zh' : 'en';
                const url = `https://lingva.ml/api/v1/${source}/${target}/${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.translation) {
                    return data.translation;
                }
                throw new Error('Lingva translation failed');
            }

            // 3. LibreTranslate API
            async function fetchLibre(text, isEnToZh) {
                const source = isEnToZh ? 'en' : 'zh';
                const target = isEnToZh ? 'zh' : 'en';
                const response = await fetch('https://translate.argosopentech.com/translate', {
                    method: 'POST',
                    body: JSON.stringify({
                        q: text,
                        source: source,
                        target: target,
                        format: "text"
                    }),
                    headers: { "Content-Type": "application/json" }
                });
                const data = await response.json();
                if (data.translatedText) {
                    return data.translatedText;
                }
                throw new Error('LibreTranslate failed');
            }

            async function translate() {
                const text = sourceText.value.trim();
                if (!text) {
                    targetText.value = '';
                    return;
                }

                loadingOverlay.classList.remove('hidden');
                let translatedResult = null;

                // Auto Fallback Strategy: MyMemory -> Lingva -> Libre
                try {
                    try {
                        translatedResult = await fetchMyMemory(text, isEnglishToChinese);
                    } catch (e1) {
                        try {
                            translatedResult = await fetchLingva(text, isEnglishToChinese);
                        } catch (e2) {
                            translatedResult = await fetchLibre(text, isEnglishToChinese);
                        }
                    }

                    if (translatedResult) {
                        targetText.value = translatedResult;
                    } else {
                        throw new Error('All engines failed');
                    }
                } catch (error) {
                    console.error('Translation Error:', error);
                    targetText.value = uiTranslations[currentUiLang].errorMsg;
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            }

            // Speech Synthesis (Text to Speech)
            function speak(text, isChinese) {
                if (!text) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = isChinese ? 'zh-TW' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }

            // Auto-translate on input debounce
            sourceText.addEventListener('input', () => {
                charCount.textContent = `${sourceText.value.length} chars`;
                clearTimeout(autoTranslateTimer);
                
                if (!sourceText.value.trim()) {
                    targetText.value = '';
                    return;
                }

                autoTranslateTimer = setTimeout(() => {
                    translate();
                }, 600);
            });

            toggleUiLangBtn.addEventListener('click', () => {
                currentUiLang = currentUiLang === 'en' ? 'zh' : 'en';
                updateUiLanguage();
            });

            swapBtn.addEventListener('click', () => {
                isEnglishToChinese = !isEnglishToChinese;
                
                const tempText = sourceText.value;
                sourceText.value = targetText.value;
                targetText.value = tempText;

                charCount.textContent = `${sourceText.value.length} chars`;
                updateLanguageLabels();
                
                if (sourceText.value.trim()) {
                    translate();
                }
            });

            translateBtn.addEventListener('click', translate);

            clearBtn.addEventListener('click', () => {
                sourceText.value = '';
                targetText.value = '';
                charCount.textContent = '0 chars';
                sourceText.focus();
            });

            copyBtn.addEventListener('click', () => {
                if (!targetText.value) return;
                targetText.select();
                try {
                    document.execCommand('copy');
                    showToast(uiTranslations[currentUiLang].toastCopy);
                } catch (err) {
                    console.error('Copy failed', err);
                }
                window.getSelection().removeAllRanges();
            });

            speakSourceBtn.addEventListener('click', () => {
                const isChinese = !isEnglishToChinese;
                speak(sourceText.value, isChinese);
            });

            speakTargetBtn.addEventListener('click', () => {
                const isChinese = isEnglishToChinese;
                speak(targetText.value, isChinese);
            });

            // Initialize UI
            updateUiLanguage();
        });
    </script>
</body>
</html>
